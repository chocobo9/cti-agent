[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-agent"
version = "0.1.0"
description = "Interface unification layer for CTI agent sessions"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0,<6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "dnspython>=2.6",
    "mmh3>=4.0",
    "geoip2>=4.8",
    "aiolimiter>=1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services such as Neo4j",
]
