[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-agent"
version = "0.1.0"
description = "Interface unification layer for CTI agent sessions"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0,<6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "dnspython>=2.6",
    "mmh3>=4.0",
    "geoip2>=4.8",
    "aiolimiter>=1.1",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-deepseek>=0.1",
    "tenacity>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services such as Neo4j (WIPES DATABASE — run only with: pytest -m integration)",
]
